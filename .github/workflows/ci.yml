
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  controller:
    name: Controller tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_PLUGIN_CACHE_DIR: ~/.terraform.d/plugin-cache
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Prepare Terraform plugin cache directory
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform plugins
        uses: actions/cache@v4
        with:
          path: ~/.terraform.d/plugin-cache
          key: ${{ runner.os }}-terraform-${{ hashFiles('infra/terraform/**/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
  security-scans:
    name: Container, IaC, and dependency scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.14.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@0.14.0
        with:
          scan-type: config
          scan-ref: .
          severity: 'HIGH,CRITICAL'

      - name: tfsec scan
        uses: aquasecurity/tfsec-action@v1.0.4
        with:
          working_directory: infra/terraform

      - name: Set up Python for dependency audit
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry and pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "poetry==1.8.2" "pip-audit==2.7.3"

      - name: Run Python dependency audit
        run: |
          poetry export --directory controller --format requirements.txt --without-hashes --output /tmp/controller-requirements.txt
          poetry export --directory workers/web/nuclei --format requirements.txt --without-hashes --output /tmp/nuclei-requirements.txt
          pip-audit -r /tmp/controller-requirements.txt
          pip-audit -r /tmp/nuclei-requirements.txt

      - name: Set up Node.js for dependency audit
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies (frozen)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run pnpm security audit
        working-directory: frontend
        run: pnpm audit --audit-level high

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install conftest
        run: |
          curl -L https://github.com/open-policy-agent/conftest/releases/download/v0.45.0/conftest_0.45.0_Linux_x86_64.tar.gz \
            | tar -xz conftest
          sudo install -m 0755 conftest /usr/local/bin/conftest

      - name: Run policy-as-code checks
        run: |
          conftest test infra/terraform --policy infra/policy
          conftest test infra/docker --policy infra/policy
          conftest test infra/helm/medusa --policy infra/policy --input helm
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    needs:
      - terraform
      - security-scans
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Helm dependency build
        run: helm dependency update infra/helm/medusa

      - name: Helm lint
        run: helm lint infra/helm/medusa

      - name: kubeconform validation
        run: |
          helm template medusa infra/helm/medusa \
            | kubeconform -strict -ignore-missing-schemas -skip SealedSecret,ExternalSecret
          helm template medusa infra/helm/medusa -f infra/helm/medusa/values-dev.yaml \
            | kubeconform -strict -ignore-missing-schemas -skip SealedSecret,ExternalSecret

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.1.4"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run database migration drift check
        run: poetry run python scripts/check_migrations.py

      - name: Run integration tests
        run: poetry run pytest -m "not slow"
      - name: Install controller dependencies
        working-directory: controller
        run: |
          poetry install --with dev

      - name: Install nuclei worker dependencies
        working-directory: workers/web/nuclei
        run: |
          poetry install --with dev

      - name: Run Python linters
        run: |
          poetry run ruff check controller workers/web/nuclei
          poetry run mypy controller workers/web/nuclei

      - name: Run Python tests
        run: |
          poetry run pytest controller/tests workers/web/nuclei/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
  supply-chain:
    name: Build, sign, and attest artifacts
    runs-on: ubuntu-latest
    needs:
      - lint-test
    permissions:
      contents: read
      id-token: write
      packages: write
    env:
      COSIGN_EXPERIMENTAL: "1"
      REGISTRY: ${{ secrets.CONTAINER_REGISTRY != '' && secrets.CONTAINER_REGISTRY || 'ghcr.io' }}
      REGISTRY_ORG: ${{ secrets.CONTAINER_REGISTRY_ORG != '' && secrets.CONTAINER_REGISTRY_ORG || github.repository_owner }}
      REGISTRY_USERNAME: ${{ secrets.CONTAINER_REGISTRY_USERNAME != '' && secrets.CONTAINER_REGISTRY_USERNAME || github.actor }}
      REGISTRY_PASSWORD: ${{ secrets.CONTAINER_REGISTRY_PASSWORD != '' && secrets.CONTAINER_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Configure image coordinates
        run: |
          echo "CONTROLLER_IMAGE=${REGISTRY}/${REGISTRY_ORG}/medusa-controller:${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=${REGISTRY}/${REGISTRY_ORG}/medusa-frontend:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.4.0

      - name: Prepare cosign key material
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 --decode > cosign.key
          chmod 600 cosign.key
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" | base64 --decode > cosign.pub
          {
            echo "COSIGN_KEY_PATH=${PWD}/cosign.key"
            echo "COSIGN_PUB_PATH=${PWD}/cosign.pub"
          } >> "$GITHUB_ENV"

      - name: Build and push controller container image
        id: build_controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/controller.Dockerfile
          push: true
          tags: ${{ env.CONTROLLER_IMAGE }}

      - name: Build and push frontend container image
        id: build_frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/frontend.Dockerfile
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}

      - name: Record immutable image references
        run: |
          mkdir -p artifacts/container
          echo "CONTROLLER_IMAGE_DIGEST=${REGISTRY}/${REGISTRY_ORG}/medusa-controller@${{ steps.build_controller.outputs.digest }}" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_DIGEST=${REGISTRY}/${REGISTRY_ORG}/medusa-frontend@${{ steps.build_frontend.outputs.digest }}" >> "$GITHUB_ENV"
          echo "${REGISTRY}/${REGISTRY_ORG}/medusa-controller@${{ steps.build_controller.outputs.digest }}" > artifacts/container/controller-image.txt
          echo "${REGISTRY}/${REGISTRY_ORG}/medusa-frontend@${{ steps.build_frontend.outputs.digest }}" > artifacts/container/frontend-image.txt

      - name: Sign container images with cosign
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          for image in "${CONTROLLER_IMAGE_DIGEST}" "${FRONTEND_IMAGE_DIGEST}"; do
            cosign sign --yes \
              --key "${COSIGN_KEY_PATH}" \
              "$image"
          done

      - name: Package Helm chart
        run: |
          mkdir -p artifacts/helm
          helm dependency update infra/helm/medusa
          helm package infra/helm/medusa --destination artifacts/helm

      - name: Sign Helm chart package
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p artifacts/signatures
          for artifact in artifacts/helm/*.tgz; do
            name=$(basename "$artifact")
            cosign sign-blob --yes \
              --key "${COSIGN_KEY_PATH}" \
              --output-signature artifacts/signatures/${name}.sig \
              --output-certificate artifacts/signatures/${name}.crt \
              --bundle artifacts/signatures/${name}.sigstore.json \
              "$artifact"
          done

      - name: Generate and publish SLSA attestations
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          mkdir -p artifacts/attestations
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          for component in controller frontend; do
            case "$component" in
              controller)
                image="${CONTROLLER_IMAGE_DIGEST}"
                ;;
              frontend)
                image="${FRONTEND_IMAGE_DIGEST}"
                ;;
            esac

            digest_ref="${image#*@}"
            digest_value="${digest_ref#sha256:}"
            predicate="artifacts/attestations/${component}-slsa.json"

            cat <<EOF > "$predicate"
{
  "_type": "https://in-toto.io/Statement/v0.1",
  "subject": [
    {
      "name": "${component}",
      "digest": {
        "sha256": "${digest_value}"
      }
    }
  ],
  "predicateType": "https://slsa.dev/provenance/v1",
  "predicate": {
    "buildDefinition": {
      "buildType": "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/ci.yml",
      "externalParameters": {
        "component": "${component}",
        "source": "${GITHUB_REPOSITORY}@${GITHUB_SHA}"
      },
      "internalParameters": {
        "image": "${image}"
      },
      "resolvedDependencies": []
    },
    "runDetails": {
      "builder": {
        "id": "https://github.com/actions"
      },
      "metadata": {
        "invocationId": "${GITHUB_RUN_ID}",
        "startedOn": "${timestamp}",
        "finishedOn": "${timestamp}"
      }
    }
  }
}
EOF

            cosign attest --yes \
              --key "${COSIGN_KEY_PATH}" \
              --type slsaprovenance \
              --predicate "$predicate" \
              "$image"
          done

      - name: Upload supply-chain artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-bundle
          path: artifacts/
