
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  controller:
    name: Controller tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Helm dependency build
        run: helm dependency update infra/helm/medusa

      - name: Helm lint
        run: helm lint infra/helm/medusa

      - name: kubeconform validation
        run: |
          helm template medusa infra/helm/medusa \
            | kubeconform -strict -ignore-missing-schemas -skip SealedSecret,ExternalSecret
          helm template medusa infra/helm/medusa -f infra/helm/medusa/values-dev.yaml \
            | kubeconform -strict -ignore-missing-schemas -skip SealedSecret,ExternalSecret

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.1.4"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run database migration drift check
        run: poetry run python scripts/check_migrations.py

      - name: Run integration tests
        run: poetry run pytest -m "not slow"
      - name: Install controller dependencies
        working-directory: controller
        run: |
          poetry install --with dev

      - name: Install nuclei worker dependencies
        working-directory: workers/web/nuclei
        run: |
          poetry install --with dev

      - name: Run Python linters
        run: |
          poetry run ruff check controller workers/web/nuclei
          poetry run mypy controller workers/web/nuclei

      - name: Run Python tests
        run: |
          poetry run pytest controller/tests workers/web/nuclei/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
