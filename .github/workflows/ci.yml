
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  controller:
    name: Controller tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v2
        with:
          poetry-version: "2.1.4"

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run database migration drift check
        run: poetry run python scripts/check_migrations.py

      - name: Run integration tests
        run: poetry run pytest -m "not slow"
      - name: Install controller dependencies
        working-directory: controller
        run: |
          poetry install --with dev

      - name: Install nuclei worker dependencies
        working-directory: workers/web/nuclei
        run: |
          poetry install --with dev

      - name: Run Python linters
        run: |
          poetry run ruff check controller workers/web/nuclei
          poetry run mypy controller workers/web/nuclei

      - name: Run Python tests
        run: |
          poetry run pytest controller/tests workers/web/nuclei/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install

      - name: Run frontend lint
        working-directory: frontend
        run: pnpm lint

      - name: Run frontend typecheck
        working-directory: frontend
        run: pnpm run typecheck
