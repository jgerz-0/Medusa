networkPolicies:
  enabled: true
  controller:
    allowedNamespaces: []
  workers:
    # Components allowed to connect to stateful data-plane services. Extend this list
    # when adding new worker Jobs so network policies stay scoped but functional.
    allowedComponents:
      - nuclei-worker
      - binary-preprocess-worker
      - binary-fuzzing-worker
      - binary-static-analysis-worker
      - cve-enrichment-worker
      - zap-worker
      - sqlmap-worker
      - validator-worker
  ingress:
    enabled: true
  egress:
    enabled: true

metrics:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 10s
      labels: {}
  grafana:
    enabled: false
    dashboards:
      enabled: true
      folder: Medusa
      annotations: {}
    datasources:
      enabled: true
      url: ""
      annotations: {}

grafana:
  adminUser: admin
  adminPassword: "changeme"
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      searchNamespace: ALL
      provider:
        name: medusa-dashboards
        orgId: 1
        folder: Medusa
        type: file
    datasources:
      enabled: true
      label: grafana_datasource
      searchNamespace: ALL

kubeconform:
  strict: true
  additionalArgs: []
