      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podAnnotations: {}
    podLabels: {}
    serviceAccount:
      create: false
      name: ""
      annotations: {}
      automountServiceAccountToken: true
    rbac:
      create: false
      roleName: ""
      roleBindingName: ""
      roleAnnotations: {}
      roleBindingAnnotations: {}
      additionalSubjects: []
      rules: []

  zap:
    enabled: false
    type: job
    parallelism: 1
    completions: 1
    backoffLimit: 6
    ttlSecondsAfterFinished: null
    image:
      repository: ghcr.io/medusa/worker-zap
      tag: ""
      pullPolicy: IfNotPresent
    component: zap-worker
    command: []
    args: []
    env:
      secretRefs:
        REDIS_URL: MEDUSA_REDIS_URL
      queueSecretKey: MEDUSA_ZAP_QUEUE_CHANNEL
      deadLetterSecretKey: MEDUSA_ZAP_DEAD_LETTER_KEY
      callbackTokenSecretKey: MEDUSA_ZAP_CALLBACK_TOKEN
      verifyTLS: true
      binary: "/zap/zap-baseline.py"
      workDir: "/tmp/zap"
      pollTimeout: 5
      maxRetries: 3
      callbackTimeout: 30
      extra: []
    reportVolume:
      mount:
        name: zap-reports
        mountPath: /tmp/zap
      volume:
        name: zap-reports
        emptyDir: {}
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
      allowPrivilegeEscalation: false
      capabilities:
        drop:
