{{- if and .Values.controller.enabled .Values.controller.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "medusa.fullname" . }}-controller
  labels:
    app.kubernetes.io/name: {{ include "medusa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    {{- $annotations := dict -}}
    {{- range $k, $v := .Values.controller.ingress.annotations }}
      {{- $_ := set $annotations $k $v -}}
    {{- end }}
    {{- $shieldEnabled := false -}}
    {{- with .Values.controller.ingress.aws }}
      {{- if hasKey . "shield" }}
        {{- if hasKey .shield "enabled" }}
          {{- $shieldEnabled = .shield.enabled -}}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $_ := set $annotations "alb.ingress.kubernetes.io/shield-advanced-protection" (ternary "true" "false" $shieldEnabled) -}}
    {{- $wafEnabled := false -}}
    {{- $wafFailOpen := false -}}
    {{- $wafArn := "" -}}
    {{- with .Values.controller.ingress.aws }}
      {{- if hasKey . "waf" }}
        {{- if hasKey .waf "enabled" }}
          {{- $wafEnabled = .waf.enabled -}}
        {{- end }}
        {{- if hasKey .waf "failOpen" }}
          {{- $wafFailOpen = .waf.failOpen -}}
        {{- end }}
        {{- if hasKey .waf "webAclArn" }}
          {{- $wafArn = trim (default "" .waf.webAclArn) -}}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- $_ := set $annotations "alb.ingress.kubernetes.io/waf-fail-open" (ternary "true" "false" $wafFailOpen) -}}
    {{- if $wafEnabled }}
      {{- $_ := set $annotations "alb.ingress.kubernetes.io/wafv2-acl-arn" (required "controller.ingress.aws.waf.webAclArn must be set when controller.ingress.aws.waf.enabled is true" $wafArn) -}}
    {{- end }}
    {{- range $key := sortAlpha (keys $annotations) }}
    {{ $key }}: {{ index $annotations $key | quote }}
    {{- end }}
spec:
  {{- if .Values.controller.ingress.className }}
  ingressClassName: {{ .Values.controller.ingress.className }}
  {{- end }}
  rules:
    {{- range .Values.controller.ingress.hosts }}
    - host: {{ .host }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ printf "%s-controller" (include "medusa.fullname" $) }}
                port:
                  number: {{ $.Values.controller.service.port }}
          {{- end }}
    {{- end }}
  {{- if .Values.controller.ingress.tls }}
  tls:
    {{- toYaml .Values.controller.ingress.tls | nindent 4 }}
  {{- end }}
{{- end -}}
