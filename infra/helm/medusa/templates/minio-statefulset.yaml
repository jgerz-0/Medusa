{{- if .Values.minio.enabled -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "medusa.fullname" . }}-minio
  labels:
    app.kubernetes.io/name: {{ include "medusa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  serviceName: {{ include "medusa.fullname" . }}-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "medusa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "medusa.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          args: ["server", "/data", "--console-address", ":{{ .Values.minio.service.consolePort }}"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_SITE_REGION
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: MINIO_SITE_REGION
            {{- range .Values.minio.env.extra }}
            - {{- toYaml . | nindent 14 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.minio.service.apiPort }}
              name: tcp-minio
            - containerPort: {{ .Values.minio.service.consolePort }}
              name: tcp-minio-console
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: tcp-minio
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: tcp-minio
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: minio-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes:
          {{- toYaml .Values.minio.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.minio.persistence.size }}
        {{- if .Values.minio.persistence.storageClass }}
        storageClassName: {{ .Values.minio.persistence.storageClass }}
        {{- end }}
{{- end -}}
