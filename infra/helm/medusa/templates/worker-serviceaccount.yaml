{{- range $name, $worker := .Values.workers }}
{{- $serviceAccount := default (dict) $worker.serviceAccount }}
{{- if $serviceAccount.create }}
{{- $context := dict "root" $ "name" $name "worker" $worker }}
{{- $serviceAccountName := include "medusa.workerServiceAccountName" $context }}
{{- $automount := ternary $serviceAccount.automountServiceAccountToken true (hasKey $serviceAccount "automountServiceAccountToken") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $serviceAccountName }}
  labels:
    app.kubernetes.io/name: {{ include "medusa.name" $ }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/version: {{ $.Chart.AppVersion | quote }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
    app.kubernetes.io/component: {{ default (printf "%s-worker" $name) $worker.component }}
  {{- $annotations := merge (dict "medusa.security/description" (printf "Dedicated service account for %s worker jobs." $name)) (default (dict) $serviceAccount.annotations) }}
  annotations:
    {{- range $k, $v := $annotations }}
    {{ $k }}: {{ $v | quote }}
    {{- end }}
automountServiceAccountToken: {{ $automount }}
---
{{- end }}
{{- end }}
