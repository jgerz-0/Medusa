{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medusa.fullname" . }}-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "medusa.name" . }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- range .Values.networkPolicies.controller.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: postgresql
          ports:
            - port: {{ .Values.postgresql.service.port }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: redis
          ports:
            - port: {{ .Values.redis.service.port }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: minio
          ports:
            - port: {{ .Values.minio.service.apiPort }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: qdrant
          ports:
            - port: {{ .Values.qdrant.service.httpPort }}
              protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medusa.fullname" . }}-data-plane
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - postgresql
          - redis
          - minio
          - qdrant
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: controller
        {{- /* Only allow enabled workers explicitly listed in values.networkPolicies.workers.allowedComponents. */}}
        {{- /* Current data-plane workers: nuclei-worker, binary-preprocess-worker, binary-fuzzing-worker, */}}
        {{- /* binary-static-analysis-worker, binary-symbolic-execution-worker, cve-enrichment-worker, */}}
        {{- /* zap-worker, sqlmap-worker, validator-worker, ticketing-worker, recon-worker, anomaly-worker. */}}
        {{- $allowedComponents := default (list) .Values.networkPolicies.workers.allowedComponents }}
        {{- range $workerName, $workerConfig := .Values.workers }}
          {{- $component := $workerConfig.component | default "" }}
          {{- if and ($workerConfig.enabled | default false) $component (has $component $allowedComponents) }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
          {{- end }}
        {{- end }}
  policyTypes:
    - Ingress
{{- end }}
