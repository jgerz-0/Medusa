{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medusa.fullname" . }}-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "medusa.name" . }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
        {{- range .Values.networkPolicies.controller.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: postgresql
          ports:
            - port: {{ .Values.postgresql.service.port }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: redis
          ports:
            - port: {{ .Values.redis.service.port }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: minio
          ports:
            - port: {{ .Values.minio.service.apiPort }}
              protocol: TCP
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: qdrant
          ports:
            - port: {{ .Values.qdrant.service.httpPort }}
              protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "medusa.fullname" . }}-data-plane
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - postgresql
          - redis
          - minio
          - qdrant
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: controller
        {{- $allowedWorkers := dict -}}
        {{- range $component := default (list) .Values.networkPolicies.workers.allowedComponents }}
          {{- if $component }}
            {{- $_ := set $allowedWorkers $component true -}}
          {{- end }}
        {{- end }}
        {{- range $workerName, $workerConfig := .Values.workers }}
          {{- if and (kindIs "map" $workerConfig) ($workerConfig.enabled | default false) }}
            {{- $component := $workerConfig.component | default "" }}
            {{- if $component }}
              {{- $_ := set $allowedWorkers $component true -}}
            {{- end }}
          {{- end }}
        {{- end }}
        {{- range $component := sortAlpha (keys $allowedWorkers) }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ $.Release.Name }}
              app.kubernetes.io/component: {{ $component }}
        {{- end }}
  policyTypes:
    - Ingress
{{- end }}
