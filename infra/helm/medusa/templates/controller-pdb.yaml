{{- if and .Values.controller.enabled .Values.controller.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "medusa.fullname" . }}-controller
  labels:
    app.kubernetes.io/name: {{ include "medusa.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: controller
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "medusa.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  {{- $min := .Values.controller.pdb.minAvailable }}
  {{- if ne $min nil }}
  minAvailable: {{ $min }}
  {{- end }}
  {{- $max := .Values.controller.pdb.maxUnavailable }}
  {{- if ne $max nil }}
  maxUnavailable: {{ $max }}
  {{- end }}
{{- end }}
