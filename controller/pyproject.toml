[tool.poetry]
name = "medusa-controller"
version = "0.1.0"
description = "Medusa controller service"
authors = ["Medusa Security Engineering"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
sqlalchemy = "^2.0.29"
alembic = "^1.13.1"
psycopg = {version = "^3.1.18", extras = ["binary"]}
pydantic = "^2.6"
python-dotenv = "^1.0"
fastapi = "^0.110.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1"
mypy = "^1.8.0"
ruff = "^0.1.9"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = [
  "E203",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
minversion = "8.0"
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    ]
testpaths = [
  "tests",
    ]

