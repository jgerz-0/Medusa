[tool.poetry]
name = "medusa-nuclei-worker"
version = "0.1.0"
description = "Nuclei scanning worker for the Medusa security pipeline"
authors = ["Medusa Security Engineering <security@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "workers", from = "../.." }
]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.0.1"
requests = "^2.31.0"
boto3 = "^1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[tool.poetry.scripts]
nuclei-worker = "workers.web.nuclei.worker:main"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"
