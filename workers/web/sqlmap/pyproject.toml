[tool.poetry]
name = "medusa-sqlmap-worker"
version = "0.1.0"
description = "SQLMap scanning worker for the Medusa security pipeline"
authors = ["Medusa Security Engineering <security@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "workers", from = "../.." }
]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.0.1"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[tool.poetry.scripts]
sqlmap-worker = "workers.web.sqlmap.worker:main"

[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = [
  "E203",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
  "tests",
]
