[tool.poetry]
name = "medusa-validator-worker"
version = "0.1.0"
description = "Validation worker for retesting high-impact Medusa findings"
authors = ["Medusa Security Engineering <security@example.com>"]
license = "Apache-2.0"
readme = "README.md"
packages = [
    { include = "workers", from = "../.." }
]

[tool.poetry.dependencies]
python = "^3.11"
redis = "^5.0.1"
requests = "^2.31.0"
pydantic = "^1.10"

[tool.poetry.scripts]
validator-worker = "workers.validator.worker:main"

[build-system]
requires = ["poetry-core>=1.5.0"]

[tool.poetry.dependencies]
python = "^3.11"
requests = "^2.31.0"
redis = "^5.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "B",
  "I",
]
ignore = [
  "E203",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra"
testpaths = [
  "tests",
]
